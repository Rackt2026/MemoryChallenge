<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff9ed">
<title>瞬間記憶チャレンジ</title>
<style>
  :root {
    color-scheme: light;
    --ink: #302652;
    --muted: #615378;
    --paper: #fff9ed;
    --white: #fff;
    --line: #e2d9f1;
    --purple: #6740a6;
    --teal: #00675b;
    --mint: #dcf8ea;
    --yellow: #ffdb62;
    --shadow: 0 5px 0 #e8ddf5, 0 9px 18px #57478212;
    font-family: "Memory Rounded", "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-weight: 500;
    line-height: 1.45;
    color: var(--ink);
    background: var(--paper);
    font-synthesis: none;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle, #e8cfe6 1px, transparent 1.5px) 0 0 / 24px 24px,
      linear-gradient(145deg, #fff8e7 10%, #fff5fa 53%, #eff9ff 100%);
  }
  button, input { font: inherit; }
  button { cursor: pointer; color: inherit; touch-action: manipulation; }
  button:disabled { cursor: default; opacity: .55; }
  :focus-visible { outline: 3px solid #1159d5; outline-offset: 3px; }
  h1, h2, p, dl { margin: 0; }
  h1, h2 { line-height: 1.15; }
  h2:focus { outline: none; }
  .shell { max-width: 1140px; margin: auto; padding: 0 clamp(12px, 3vw, 32px) 22px; }
  .topbar { min-height: 65px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand, .eyebrow, .tag { font-weight: 700; letter-spacing: .08em; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: .79rem; white-space: nowrap; }
  .brand-icon { color: #7e4c06; background: #ffe998; border: 1px solid #e7b753; border-radius: 10px; padding: 4px 7px; }
  .sound, .soft, .primary {
    min-height: 44px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 14px;
    font-weight: 700; background: var(--white);
  }
  .sound { white-space: nowrap; font-size: .82rem; }
  .sound[aria-pressed="true"] { background: var(--mint); border-color: #a4d9c8; }
  .soft:hover, .key:hover { border-color: var(--purple); }
  .primary { background: var(--yellow); border-color: #c88421; box-shadow: 0 3px 0 #c88421; min-width: min(200px, 100%); }
  .primary:not(:disabled):hover { background: #ffeb99; }
  .primary:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #c88421; }
  .hero {
    position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 12px; padding: clamp(14px, 3vw, 30px); border: 2px solid #f1c36f; border-radius: 26px;
    background: radial-gradient(ellipse at 86% 40%, #fff9d6 0, transparent 38%), linear-gradient(117deg, #fff2a8, #ffdbbb 64%, #fbd4eb);
    box-shadow: 0 5px 0 #f4d8aa, 0 9px 18px #a16e2814;
  }
  .hero .eyebrow {
    display: inline-block; color: #744d24; background: #fffaf0; padding: 3px 9px;
    border-radius: 999px; font-size: .74rem;
  }
  h1 { font-size: clamp(1.55rem, 5.25vw, 3.55rem); font-weight: 700; margin: 8px 0; }
  .hero p:last-child { font-size: clamp(.82rem, 2vw, 1.13rem); font-weight: 500; }
  .hero-art { width: clamp(86px, 24vw, 235px); height: auto; overflow: visible; }
  .setup { display: grid; gap: 12px; margin-top: 16px; }
  .panel {
    background: var(--white); border: 2px solid var(--line); border-radius: 20px;
    box-shadow: 0 3px 0 #eddfed; padding: clamp(10px, 1.6vw, 17px);
  }
  fieldset { border: 0; padding: 0; margin: 0; min-inline-size: 0; }
  legend { padding: 0; margin: 0 0 8px; font-weight: 700; font-size: 1.05rem; }
  .step { display: inline-grid; place-items: center; margin-right: 7px; width: 1.65em; aspect-ratio: 1; background: #ffe8a0; border-radius: 50%; font-size: .83em; }
  .setup-row .panel:first-child .step { background: #d3f3e8; }
  .setup-row .panel:last-child .step { background: #ebddff; }
  .options { display: grid; gap: 8px; }
  .games { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .styles, .setup-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .setup-row { gap: 14px; }
  .choice {
    position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column;
    min-height: 48px; padding: 8px 5px; gap: 3px; text-align: center; background: #faf7ff;
    border: 2px solid var(--line); border-radius: 13px; font-weight: 700; cursor: pointer;
  }
  .games .choice { background: color-mix(in srgb, var(--tile) 36%, white); }
  .styles .choice { background: #effaf6; }
  .style-icon { display: none; }
  .choice.ramp { grid-column: 1 / -1; flex-direction: row; gap: 7px; min-height: 44px; background: #f3eaff; }
  .ramp-icon { color: var(--purple); font-size: 1.12em; }
  .choice:hover { border-color: var(--purple); }
  .choice:has(input:checked) { border-color: var(--purple); box-shadow: inset 0 -3px 0 #b699e2; }
  .levels .choice:has(input:checked) { background: #ecddff; }
  .choice:has(input:focus-visible) { outline: 3px solid #1159d5; outline-offset: 2px; }
  .choice input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .choice small { font-size: .73rem; color: var(--muted); font-weight: 500; }
  .game-icon { display: grid; place-items: center; width: 37px; height: 34px; border-radius: 9px; background: var(--tile); font-size: 1.18rem; }
  .game-name-short { display: none; }
  .launch { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff8dd; border-color: #f0d99a; }
  .launch p { font-size: .87rem; font-weight: 500; }
  .muted { color: var(--muted); }
  .subtle { color: var(--muted); font-size: .86rem; }
  .storage-note { margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .session-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px 10px; margin-bottom: 8px; }
  .session-head .soft { padding-inline: 10px; }
  .tag { font-size: .78rem; background: #efdeff; padding: 6px 10px; border-radius: 999px; display: inline-block; }
  .track { display: grid; grid-template-columns: repeat(var(--rounds), 1fr); gap: 5px; margin-bottom: 8px; }
  .track span { position: relative; height: 7px; background: #e7def3; border-radius: 5px; }
  .track .past { background: #9870d2; }
  .track .current { background: var(--yellow); box-shadow: inset 0 0 0 1px #947016; }
  .track [data-level-up]::before {
    content: ''; position: absolute; left: -3px; top: -2px; width: 1px; height: 11px; background: #a181c8;
  }
  .hud, .result-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .hud { margin-bottom: 10px; }
  .hud div, .result-stats div { padding: 6px 3px; text-align: center; border-radius: 10px; background: #fff1c4; }
  .hud div:nth-child(2), .result-stats div:nth-child(2) { background: #f5e5ff; }
  .hud div:nth-child(3), .result-stats div:nth-child(3) { background: #e2f4ff; }
  .hud div:nth-child(4), .result-stats div:nth-child(4) { background: var(--mint); }
  dt { font-size: clamp(.62rem, 2.5vw, .84rem); color: var(--muted); font-weight: 700; }
  dd { margin: 0; font-size: clamp(.82rem, 3.2vw, 1.35rem); font-weight: 700; font-variant-numeric: tabular-nums; }
  .arena {
    padding: clamp(9px, 2vw, 24px); border: 2px solid var(--line); border-radius: 24px; background: var(--white);
    box-shadow: var(--shadow); text-align: center;
  }
  .arena h2 { margin: 6px 0; font-weight: 700; font-size: clamp(1.18rem, 4vw, 2.15rem); }
  .level-up { color: var(--purple); font-weight: 700; font-size: .88rem; margin-top: 5px; }
  .hint { font-size: clamp(.78rem, 2.5vw, 1rem); color: var(--muted); font-weight: 500; }
  .center-card {
    margin: 10px auto; display: grid; place-items: center; min-height: clamp(104px, 23vh, 235px);
    border: 2px dashed #d8c8eb; border-radius: 17px; background: #faf4ff;
    background: color-mix(in srgb, var(--round-color) 35%, white); padding: 8px;
  }
  .classroom .center-card { min-height: clamp(145px, 34vh, 370px); }
  .countdown { font-size: clamp(3.2rem, 15vw, 8rem); font-weight: 700; color: var(--purple); line-height: 1.05; }
  .wait-icon { color: var(--purple); font-size: clamp(2.2rem, 10vw, 5rem); }
  .tokens {
    display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: clamp(2px, 1vw, 10px);
    max-width: min(100%, calc(var(--columns) * var(--token-width))); width: 100%; margin: 0 auto;
    --token-width: 75px; --token-font: clamp(1.1rem, 4.5vw, 3.3rem);
  }
  .classroom .center-card .tokens { --token-width: 106px; --token-font: clamp(1.35rem, 6.4vw, 5rem); }
  .token {
    display: grid; place-items: center; min-width: 0; aspect-ratio: 1; border: 2px solid var(--ink);
    border-radius: clamp(5px, 1.4vw, 15px); background: var(--tile, #fff); color: var(--ink);
    font-size: var(--token-font); line-height: 1; font-weight: 700;
  }
  .shape-token { background: #fffaff; border-color: #d9c8ed; }
  .shape-icon { display: block; width: 76%; height: auto; max-width: 88px; }
  .token.empty { border: 1px dashed #b2c3d4; background: #f1f5fa; }
  .meter { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
  .meter progress { flex: 1; max-width: 420px; min-width: 0; height: 14px; accent-color: var(--teal); }
  #remaining { min-width: 11em; font-size: .8rem; white-space: nowrap; }
  .answer-count { margin: 4px 0; font-size: .84rem; color: var(--muted); font-weight: 700; }
  .keypad {
    display: grid; grid-template-columns: repeat(var(--key-columns), 1fr);
    max-width: 450px; gap: 6px; margin: 9px auto 0;
  }
  .key {
    display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px;
    padding: 3px; border: 2px solid var(--line); border-radius: 10px; background: #faf7ff; font-weight: 700;
  }
  .key b { font-size: clamp(1.16rem, 4.5vw, 1.65rem); line-height: 1; }
  .key .shape-icon { width: 32px; max-width: 80%; }
  .key small { font-size: .73rem; }
  .swatch { display: inline-block; width: 17px; height: 17px; border-radius: 5px; border: 1px solid var(--ink); background: var(--tile); }
  .grid {
    display: grid; grid-template-columns: repeat(var(--size), minmax(0, 1fr)); gap: clamp(2px, 1vw, 6px);
    width: min(100%, 260px); margin: 0 auto;
  }
  .classroom .grid { width: min(100%, 46vh, 500px); }
  .cell {
    display: grid; place-items: center; aspect-ratio: 1; padding: 0; min-width: 0;
    background: #e8eff6; border: 2px solid #b4c7d8; border-radius: 8px; font-weight: 700;
    font-size: clamp(.85rem, 3.8vw, 2.1rem); line-height: 1;
  }
  .cell.lit, .cell.missed {
    background: radial-gradient(circle, #fffef2 5%, #fff2aa 53%, #ffda74 100%);
    border-color: #ce8d29;
  }
  .grid-glow { display: block; width: 77%; max-width: 50px; height: auto; }
  .cell.selected { background: #2257aa; border-color: #103570; color: #fff; }
  .cell.hit { background: #a1e9bd; border-color: #146039; }
  .cell.wrong { background: #ffb8c8; border-color: #9c294f; }
  .grid-legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px;
    font-size: .76rem; font-weight: 500; margin-top: 6px;
  }
  .grid-legend span { display: inline-flex; align-items: center; gap: 2px; }
  .grid-legend .grid-glow { width: 18px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
  .actions .soft, .actions .primary { font-size: clamp(.77rem, 3vw, .99rem); }
  .answer-actions .primary { min-width: 84px; flex: 0 1 145px; }
  .comparison { display: grid; gap: 8px; max-width: 780px; margin: 10px auto 0; }
  .compare-row { display: grid; gap: 4px; }
  .compare-row p { font-weight: 700; font-size: .82rem; }
  .good { color: var(--teal); }
  .sparkle { display: inline-block; color: #9a5900; animation: shine .6s ease-out both; }
  @keyframes shine { from { transform: scale(.6) rotate(-30deg); } 60% { transform: scale(1.3) rotate(14deg); } to { transform: none; } }
  .result { padding-block: clamp(18px, 4vw, 38px); }
  .score { font-size: clamp(2.4rem, 11vw, 5.25rem); font-weight: 700; color: var(--teal); line-height: 1.12; margin: 12px 0 4px; }
  .score small { font-size: .36em; }
  .title-award { font-weight: 700; font-size: clamp(1rem, 4vw, 1.5rem); margin: 7px 0; }
  .result-stats { margin: 12px auto; max-width: 660px; }
  .best-result { font-weight: 700; font-size: .88rem; }
  @media (min-width: 721px) {
    .styles .choice { min-height: 116px; }
    .style-icon {
      display: grid; place-items: center; min-width: 36px; height: 32px; padding-inline: 5px;
      background: #c7efdf; color: #17654f; border-radius: 10px; margin-bottom: 4px;
    }
  }
  @media (max-width: 720px) {
    .setup-row { grid-template-columns: 1fr; gap: 10px; }
    .setup { gap: 10px; margin-top: 14px; }
    .topbar { min-height: 53px; }
    .games { gap: 4px; }
    .games .choice { font-size: .73rem; padding-inline: 2px; }
    .game-name-full { display: none; }
    .game-name-short { display: inline; }
  }
  @media (max-width: 460px) {
    #home { line-height: 1.35; }
    .hero { padding: 9px 11px; gap: 2px; }
    .hero-art { width: clamp(56px, 17vw, 78px); }
    .setup { gap: 8px; margin-top: 12px; }
    .setup-row { gap: 8px; }
    .setup .panel { padding: 8px 10px; border-radius: 16px; }
    .setup legend { font-size: .95rem; margin-bottom: 5px; }
    .setup .choice { padding: 5px 2px; gap: 2px; }
    .game-icon { width: 30px; height: 27px; font-size: 1rem; }
    .levels { gap: 4px; }
    .levels .choice { font-size: clamp(.62rem, 3vw, .8rem); padding-inline: 1px; }
    .levels .ramp { gap: 5px; font-size: .75rem; }
    .styles .choice { font-size: clamp(.68rem, 3.3vw, .9rem); }
    .styles .choice small { font-size: clamp(.61rem, 2.8vw, .72rem); }
    .launch { flex-wrap: wrap; gap: 6px; }
    .launch p { font-size: .78rem; }
    .launch .primary { width: 100%; }
    .session-head .tag { font-size: .69rem; letter-spacing: .02em; padding-inline: 7px; }
    .session-head .soft { font-size: .75rem; padding-inline: 6px; }
    .key small { font-size: .67rem; }
    .key { gap: 2px; }
    .tokens { gap: 2px; }
    .token { border-width: 1px; }
  }
  @media (max-width: 350px) {
    .topbar { min-height: 48px; }
    .hero { padding-block: 8px; }
    .hero h1 { margin-block: 4px; }
    .hero h1 { font-size: 1.35rem; }
    .hero .eyebrow { font-size: .64rem; }
    .hero p:last-child { font-size: .72rem; }
    .setup { margin-top: 8px; }
    .setup, .setup-row { gap: 4px; }
    .setup .panel { padding-block: 5px; }
    .setup legend { margin-bottom: 4px; }
    .setup .choice { min-height: 44px; }
    .styles .choice small { display: none; }
    .launch { display: grid; grid-template-columns: minmax(0, 1fr) 112px; }
    .launch p { font-size: .7rem; }
    .launch .primary { min-width: 0; padding-inline: 3px; font-size: .7rem; }
  }
  @media (max-width: 350px) and (max-height: 620px) {
    .center-card .grid { width: min(100%, 224px); }
  }
  @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
</style>

<style>
  @font-face {
    font-family: "Memory Rounded";
    font-weight: 500;

const PRAISE = { 3: 'いいぞ！', 5: 'すごい集中力！', 10: 'パーフェクト！' };
const TITLE = [[100, '記憶の神さま'], [80, 'スーパー記憶マスター'], [60, '記憶の達人'],

const storePrefix = 'memory-arcade.v1.';
const sessionStore = new Map();
let storageLimited = false;

let phase = 'home';
let frameId = 0;
let timeoutId = 0;
let clockVersion = 0;
let timedStep = null;
let deadline = 0;

function randomInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}
function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = randomInt(0, i);
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}
function questionFor(kind, level, levelIndex) {
  if (kind === 'place') {
    const values = shuffle(Array.from({ length: level.size ** 2 }, (_, i) => i));
    return { kind, size: level.size, values: values.slice(0, level.lit).sort((a, b) => a - b) };
  }
  const count = randomInt(...(kind === 'number' ? level.number : level.sequence));
  const pool = kind === 'number' ? [...DIGITS] : (kind === 'color' ? COLORS : SHAPES).map((_, i) => i);
  const values = [];
  while (values.length < count) {
    const choices = kind === 'number' && levelIndex < 2 ? pool.filter(value => value !== values.at(-1)) : pool;
    values.push(choices[randomInt(0, choices.length - 1)]);
  }
  return { kind, values };
}
function buildQuestions(mode, levelIndex) {
  // ミックスは4種類を一巡ずつ混ぜ、境目でも同じ種類を続けない。
  const kinds = [];
  while (kinds.length < ROUNDS) {
    const batch = mode === 'mix' ? shuffle([...KINDS]) : [mode];
    if (batch.length > 1 && kinds.at(-1) === batch[0]) [batch[0], batch[1]] = [batch[1], batch[0]];
    kinds.push(...batch);
  }
  const seen = new Set();
  return kinds.slice(0, ROUNDS).map((kind, round) => {
    const roundLevel = levelIndex === RAMP_LEVEL ? RAMP_STEPS[round] : levelIndex;
    let item, key;
    do {
      item = questionFor(kind, LEVELS[roundLevel], roundLevel);
      key = kind + ':' + item.values.join(',');
    } while (seen.has(key));
    seen.add(key);
    return { ...item, levelIndex: roundLevel };
  });
}
function matches(question, answer) {
  return answer.length === question.values.length && question.values.every((value, i) =>
    question.kind === 'place' ? answer.includes(value) : answer[i] === value
  );
}

function storageNote() {
  $('storage-note').textContent = storageLimited
    ? 'このブラウザーでは、記録はページを開いている間だけ使えます。'
    : '自己ベストは、このブラウザーに保存されます。';
}
function readStore(key) {
  if (sessionStore.has(key)) return sessionStore.get(key);
  try { return localStorage.getItem(storePrefix + key); }
  catch { storageLimited = true; return null; }
}
function writeStore(key, value) {
  sessionStore.set(key, value);
  try { localStorage.setItem(storePrefix + key, value); }
  catch { storageLimited = true; storageNote(); }
}
function recordKey(mode, level) { return 'best.' + mode + '.' + level; }
function bestFor(mode, level) {
  try {
    const data = JSON.parse(readStore(recordKey(mode, level)));
    if (data && Number.isInteger(data.score) && data.score >= 0 && data.score <= 100 &&
        data.score % 10 === 0 && Number.isFinite(data.ms) && data.ms >= 0) return data;
  } catch { /* 壊れた記録は未記録として扱う。 */ }
  return null;
}
function finishRecord() {
  const previous = bestFor(game.mode, game.levelIndex);
  const current = { score: game.correct * 10, ms: Math.round(game.totalMs) };
  game.newBest = !previous || current.score > previous.score ||
    (current.score === previous.score && current.ms < previous.ms);
  if (game.newBest) writeStore(recordKey(game.mode, game.levelIndex), JSON.stringify(current));
  game.best = game.newBest ? current : previous;
}

let soundOn = readStore('sound') !== 'off';
let audioContext;
const activeSounds = new Set();
function paintSound() {
  sound.textContent = '効果音 ' + (soundOn ? 'ON' : 'OFF');
  sound.setAttribute('aria-pressed', String(soundOn));
}
function unlockSound() {
  if (!soundOn) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    audioContext ||= new Audio();
    if (audioContext.state !== 'running') audioContext.resume().catch(() => {});
  } catch { /* 音声を利用できない場合もゲームは続ける。 */ }
}
function tone(notes) {
  if (!soundOn || document.hidden || audioContext?.state !== 'running') return;
  const start = audioContext.currentTime;
  notes.forEach((hz, i) => {
    const oscillator = audioContext.createOscillator();
    const volume = audioContext.createGain();
    const at = start + i * .12;
    oscillator.frequency.value = hz;
    volume.gain.setValueAtTime(.001, at);
    volume.gain.exponentialRampToValueAtTime(.09, at + .013);
    volume.gain.exponentialRampToValueAtTime(.001, at + .125);
    oscillator.connect(volume).connect(audioContext.destination);
    activeSounds.add(oscillator);
    oscillator.onended = () => {
      activeSounds.delete(oscillator);
      oscillator.disconnect();
      volume.disconnect();
    };
    oscillator.start(at);
    oscillator.stop(at + .13);
  });
}
function stopSounds() {
  for (const oscillator of activeSounds) oscillator.stop();
}
sound.addEventListener('click', () => {
  soundOn = !soundOn;
  writeStore('sound', soundOn ? 'on' : 'off');
  paintSound();
  if (soundOn) { unlockSound(); tone([660]); }
  else stopSounds();
});
paintSound();

function shapeIcon([, fill, outline, path]) {
  return '<svg class="shape-icon" viewBox="0 0 32 32" aria-hidden="true">' +
    '<path d="' + path + '" fill="' + fill + '" stroke="' + outline +
    '" stroke-width="1.8" stroke-linejoin="round"/>' +
    '<path d="m13.2 12.4 2-2.2" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" stroke-linecap="round"/>' +
    '</svg>';
}
function tokens(kind, values, count = values.length) {
  const tiles = Array.from({ length: count }, (_, i) => {
    const value = values[i];
    if (value === undefined) return '<span class="token empty" aria-hidden="true"></span>';
    if (kind === 'color') {
      const [name, color] = COLORS[value];
      return '<span class="token" role="img" aria-label="' + name + '" style="--tile:' + color + '"></span>';
    }
    if (kind === 'shape') {
      const shape = SHAPES[value];
      return '<span class="token shape-token" role="img" aria-label="' + shape[0] + '">' + shapeIcon(shape) + '</span>';
    }
    return '<span class="token">' + value + '</span>';
  });
  return '<div class="tokens" style="--columns:' + count + '">' + tiles.join('') + '</div>';
}
function grid(question, view, answer = []) {
  const cells = Array.from({ length: question.size ** 2 }, (_, i) => {
    const label = (Math.floor(i / question.size) + 1) + '行' + (i % question.size + 1) + '列';
    if (view === 'input') {
      return '<button type="button" class="cell" data-cell="' + i + '" aria-label="' + label + '" aria-pressed="false"></button>';
    }
    const target = question.values.includes(i);
    const picked = answer.includes(i);
    let status = '', mark = '', note = '';
    if (view === 'pattern' && target) [status, mark, note] = ['lit', GRID_GLOW, ' 光ったマス'];
    if (view === 'review') {
      if (target && picked) [status, mark, note] = ['hit', '✓', ' 正解'];
      else if (target) [status, mark, note] = ['missed', GRID_GLOW, ' 選び忘れ'];
      else if (picked) [status, mark, note] = ['wrong', '×', ' まちがい'];
    }
    return '<span class="cell ' + status + '"' + (note ? ' role="img" aria-label="' + label + note + '"' : ' aria-hidden="true"') + '>' + mark + '</span>';
  });
  return '<div class="grid" style="--size:' + question.size + '">' + cells.join('') + '</div>';
}
function pattern(question) {
  return question.kind === 'place' ? grid(question, 'pattern') : tokens(question.kind, question.values);
}
function keypad(kind) {
  let keys;
  if (kind === 'number') keys = [...'1234567890'].map(value => [value, '<b>' + value + '</b>', value]);
  if (kind === 'color') keys = COLORS.map(([name, color], i) =>
    [i, '<span class="swatch" aria-hidden="true" style="--tile:' + color + '"></span><small>' + name + '</small>', name]);
  if (kind === 'shape') keys = SHAPES.map((shape, i) => [i, shapeIcon(shape), shape[0]]);
  return '<div class="keypad" style="--key-columns:' + (kind === 'number' ? 5 : kind === 'color' ? 3 : 4) + '">' +
    keys.map(([value, content, name]) => '<button class="key" type="button" data-value="' + value +
      '" aria-label="' + name + '">' + content + '</button>').join('') + '</div>';
}
const button = (action, label, style = 'primary') =>
  '<button type="button" class="' + style + '" data-action="' + action + '">' + label + '</button>';
const actions = (content, extra = '') => '<div class="actions ' + extra + '">' + content + '</div>';
const hint = content => '<p class="hint">' + content + '</p>';
const stage = title => '<h2 id="stage-title" tabindex="-1">' + title + '</h2>';
const card = content => '<div class="center-card">' + content + '</div>';

function currentQuestion() { return game.questions[game.index]; }
function currentLevel() { return LEVELS[currentQuestion().levelIndex]; }
function isLevelUp(index) {
  return index > 0 && game.questions[index].levelIndex > game.questions[index - 1].levelIndex;
}
function paintHeader() {

  $('round-label').textContent = (game.classroom ? '教室' : 'ひとり') + ' ／ ' +

  $('track').style.setProperty('--rounds', ROUNDS);
  $('track').innerHTML = game.questions.map((_, index) =>
    '<span class="' + (index < game.index || phase === 'result' ? 'past' : index === game.index ? 'current' : '') + '"' +
    (isLevelUp(index) ? ' data-level-up' : '') + '></span>'

    ['得点', game.correct * 10 + '点'], ['連続せいかい', game.streak + '問'],
    ['回答合計', '<span id="answer-time">' + seconds(game.totalMs) + '</span>'],
    ['自己ベスト', game.best ? game.best.score + '点' : '—']

}
function paintAnswer() {
  const question = currentQuestion();
  $('answer-count').textContent = game.answer.length + ' / ' + question.values.length +
    (question.kind === 'place' ? 'マス選択' : 'こ入力');
  if (question.kind === 'place') {
    arena.querySelectorAll('[data-cell]').forEach(cell => {
      const selected = game.answer.includes(Number(cell.dataset.cell));
      cell.classList.toggle('selected', selected);
      cell.setAttribute('aria-pressed', String(selected));
      cell.textContent = selected ? '✓' : '';
    });
  } else $('answer-slots').innerHTML = tokens(question.kind, game.answer, question.values.length);
  arena.querySelector('[data-action="clear"]').disabled = !game.answer.length;
  const undo = arena.querySelector('[data-action="undo"]');
  if (undo) undo.disabled = !game.answer.length;
  arena.querySelector('[data-action="submit"]').disabled = game.answer.length !== question.values.length;
}
function answerScreen(question) {
  const place = question.kind === 'place';
  const instructions = place ? '光っていたマスをえらぼう。もう一度押すと取り消せるよ。' :
    GAMES[question.kind].short + 'を覚えた順番で入れよう。';
  const inputs = place ? grid(question, 'input') :
    '<div id="answer-slots"></div>' + keypad(question.kind);
  return stage('こたえてみよう！') + hint(instructions) +
    '<p class="answer-count" id="answer-count"></p>' + inputs + actions(
      (place ? '' : button('undo', '1文字消す', 'soft')) +
      button('clear', '全部消す', 'soft') + button('submit', '決定'), 'answer-actions'
    );
}
function reviewScreen(question) {
  const next = game.index === ROUNDS - 1 ? '結果を見る →' : '次の問題へ →';
  const title = game.lastCorrect ? '<span class="good">せいかい！</span> <span class="sparkle" aria-hidden="true">✦</span>' : 'おしい！';
  let review = '';
  if (question.kind === 'place') {
    review = grid(question, 'review', game.answer) +
      '<p class="grid-legend"><span>✓ 正解のマス</span><span>' + GRID_GLOW +
      '選び忘れ</span><span>× ちがうマス</span></p>';
  } else {
    review = '<div class="comparison"><div class="compare-row"><p>せいかい</p>' +
      pattern(question) + '</div>' + (game.lastCorrect ? '' :
        '<div class="compare-row"><p>キミのこたえ</p>' + tokens(question.kind, game.answer) + '</div>') + '</div>';
  }
  return stage(title) + hint(PRAISE[game.streak] || (game.lastCorrect ? '＋10点！' : 'せいかいを見てみよう。')) +
    review + actions(button('next', next));
}
function resultScreen() {
  const buttons = actions(button('home', 'トップにもどる', 'soft') + button('retry', 'もう一度あそぶ'));
  if (game.classroom) return stage('全' + ROUNDS + '問 おつかれさま！') + card('<span class="wait-icon" aria-hidden="true">🏁</span>') + buttons;
  const score = game.correct * 10;
  const title = TITLE.find(([minimum]) => score >= minimum)[1];
  return stage('結果発表') + '<p class="score">' + score + '<small> / 100点</small></p>' +
    '<p class="title-award">今回の称号　' + title + '</p><dl class="result-stats">' + stats([
      ['正解数', game.correct + ' / ' + ROUNDS + '問'], ['正答率', score + '%'],
      ['最大連続正解', game.maxStreak + '問'], ['回答合計時間', seconds(game.totalMs)]
    ]) + '</dl><p class="best-result">' + (game.newBest ? '✦ 自己ベスト更新！　' : '自己ベスト　') +
    bestText(game.best) + '</p>' + (storageLimited ? '<p class="storage-note">記録はこのページを開いている間だけ使えます。</p>' : '') + buttons;
}

function paintStage() {
  const question = currentQuestion();
  const gameTitle = GAMES[question.kind].name;
  const gameHint = GAMES[question.kind].hint;
  arena.classList.toggle('result', phase === 'result');
  arena.style.setProperty('--round-color', GAMES[question.kind].tile);
  paintHeader();
  switch (phase) {
    case 'ready':
      arena.innerHTML = stage(game.mode === 'mix' ? GAMES.mix.name : gameTitle) +
        hint(game.mode === 'mix' ? '数字・色・図形・場所のどれかが出るよ。' : gameHint) +
        card('<span class="wait-icon" aria-hidden="true">✦</span>') + actions(button('show', '問題を表示'));
      break;
    case 'countdown':
      arena.innerHTML = stage(gameTitle) + hint(gameHint) +
        (isLevelUp(game.index) ? '<p class="level-up">✦ レベルアップ！</p>' : '') +
        card('<span class="countdown" id="count">3</span>');
      break;
    case 'memory': {
      const time = currentLevel().time;
      arena.innerHTML = stage(gameTitle) + hint(gameHint) + card(pattern(question)) +
        '<div class="meter"><progress id="meter" aria-label="記憶時間の残り" max="' + time +
        '" value="' + time + '"></progress><span id="remaining">START！</span></div>';
      break;
    }
    case 'answer':
      arena.innerHTML = answerScreen(question);
      paintAnswer();
      break;
    case 'waiting':
      arena.innerHTML = stage('こたえを書こう！') +
        hint('紙やホワイトボードに、覚えたこたえを書こう。') +
        card('<span class="wait-icon" aria-hidden="true">✎</span>') + actions(button('reveal', '正解を見る'));
      break;
    case 'reveal':
      arena.innerHTML = stage('せいかいは…') + card(pattern(question)) +
        actions(button('next', game.index === ROUNDS - 1 ? '授業結果へ →' : '次の問題へ →'));
      break;
    case 'review':
      arena.innerHTML = reviewScreen(question);
      break;
    case 'result':
      arena.innerHTML = resultScreen();
      break;
  }
  $('stage-title').focus({ preventScroll: true });
}

// 時刻差で進行し、表示更新が遅れても秒数を数え直さない。
// 画面を切り替えるたびに予約を破棄し、古いコールバックの遷移を防ぐ。
function stopClock() {
  clockVersion++;
  cancelAnimationFrame(frameId);
  clearTimeout(timeoutId);
  frameId = timeoutId = 0;
  timedStep = null;
}
function changePhase(next) {
  stopClock();
  phase = next;
  paintStage();
  if (window.scrollY) window.scrollTo(0, 0);
}
function runClock(duration, update, complete) {
  deadline = performance.now() + duration;
  const version = clockVersion;
  function tick() {
    if (version !== clockVersion) return;
    cancelAnimationFrame(frameId);
    const left = Math.max(0, deadline - performance.now());
    if (left === 0) {
      clearTimeout(timeoutId);
      complete();
      return;
    }
    update(left);
    frameId = requestAnimationFrame(tick);
  }
  timedStep = tick;
  timeoutId = setTimeout(tick, duration);
  tick();
}
function beginCountdown() {
  changePhase('countdown');
  let previous = 0;
  runClock(3000, left => {
    const count = Math.ceil(left / 1000);
    if (count === previous) return;
    $('count').textContent = count;
    previous = count;
    tone([440]);
  }, () => {
    if (document.hidden) $('count').textContent = 'START！';
    else beginMemory();
  });
}
function beginMemory() {
  changePhase('memory');
  tone([880]);
  const duration = currentLevel().time * 1000;
  const meter = $('meter');
  const remaining = $('remaining');
  runClock(duration, left => {
    meter.value = left / 1000;
    const label = (duration - left < 360 ? 'START！ ' : '') + 'のこり ' + Math.ceil(left / 1000) + '秒';
    if (remaining.textContent !== label) remaining.textContent = label;
  }, () => {
    if (game.classroom) changePhase('waiting');
    else {
      changePhase('answer');
      game.answerStart = performance.now();
      paintAnswerTime(clockVersion);
    }
  });
}
function paintAnswerTime(version) {
  if (version !== clockVersion) return;
  const display = $('answer-time');
  const time = seconds(game.totalMs + performance.now() - game.answerStart);
  if (display.textContent !== time) display.textContent = time;
  frameId = requestAnimationFrame(() => paintAnswerTime(version));
}
document.addEventListener('visibilitychange', () => {
  // カウントダウン後、初回の表示はタブが見えてから開始する。
  // すでに記憶中なら元の締切を使い、期限切れの問題をすぐ取り除く。
  if (timedStep) timedStep();
});

function start(mode, levelIndex, classroom) {
  game = {
    mode, levelIndex, classroom, questions: buildQuestions(mode, levelIndex),
    index: 0, answer: [], correct: 0, streak: 0, maxStreak: 0, totalMs: 0,
    best: classroom ? null : bestFor(mode, levelIndex)
  };
  unlockSound();
  home.hidden = true;
  play.hidden = false;
  play.classList.toggle('classroom', classroom);
  if (classroom) changePhase('ready');
  else beginCountdown();
}
function goHome() {
  stopClock();
  stopSounds();
  phase = 'home';
  game = null;
  arena.replaceChildren();
  play.hidden = true;
  home.hidden = false;
  paintSetup();
  window.scrollTo(0, 0);
  setup.querySelector('button[type="submit"]').focus({ preventScroll: true });
}
setup.addEventListener('submit', event => {
  event.preventDefault();
  if (phase !== 'home') return;
  const { mode, level, style } = setup.elements;
  start(mode.value, Number(level.value), style.value === 'classroom');
});
$('quit').addEventListener('click', goHome);

function addValue(value) {
  if (game.answer.length >= currentQuestion().values.length) return;
  game.answer.push(value);
  paintAnswer();
}
function toggleCell(index) {
  const at = game.answer.indexOf(index);
  if (at >= 0) game.answer.splice(at, 1);
  else if (game.answer.length < currentQuestion().values.length) game.answer.push(index);
  paintAnswer();
}
function submitAnswer() {
  if (phase !== 'answer' || game.classroom) return;
  const question = currentQuestion();
  if (game.answer.length !== question.values.length) return;
  // 先に受付を閉じるため、連打やキー入力で同じ問題を加算できない。
  phase = 'scoring';
  game.totalMs += performance.now() - game.answerStart;
  game.lastCorrect = matches(question, game.answer);
  if (game.lastCorrect) { game.correct++; game.streak++; }
  else game.streak = 0;
  game.maxStreak = Math.max(game.maxStreak, game.streak);
  changePhase('review');
  tone(game.lastCorrect ? [523, 659, 784] : [392, 349]);
}
function nextQuestion() {
  if (game.index === ROUNDS - 1) {
    if (!game.classroom) finishRecord();
    changePhase('result');
    return;
  }
  game.index++;
  game.answer = [];
  if (game.classroom) changePhase('ready');
  else beginCountdown();
}
arena.addEventListener('click', event => {
  const control = event.target.closest('button');
  if (!control || !arena.contains(control) || control.disabled) return;
  const { action, value, cell } = control.dataset;
  if (action && action !== 'undo' && event.detail > 1) return;
  if (phase === 'answer') {
    if (cell !== undefined) toggleCell(Number(cell));
    else if (value !== undefined) addValue(currentQuestion().kind === 'number' ? value : Number(value));
    else if (action === 'submit') submitAnswer();
    else if (action === 'clear' || action === 'undo') {
      if (action === 'clear') game.answer = [];
      else game.answer.pop();
      paintAnswer();
    }
  } else if (phase === 'ready' && action === 'show') {
    unlockSound();
    beginCountdown();
  } else if (phase === 'waiting' && action === 'reveal') changePhase('reveal');
  else if ((phase === 'review' || phase === 'reveal') && action === 'next') nextQuestion();
  else if (phase === 'result' && action === 'retry') start(game.mode, game.levelIndex, game.classroom);
  else if (phase === 'result' && action === 'home') goHome();
});
document.addEventListener('keydown', event => {
  if (phase === 'home' || event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key;
  if (event.repeat && (key === 'Enter' || key === ' ')) {
    event.preventDefault();
    return;
  }
  if (phase !== 'answer' || currentQuestion().kind !== 'number') return;
  if (DIGITS.includes(key) && key.length === 1) addValue(key);
  else if (key === 'Backspace') { game.answer.pop(); paintAnswer(); }
  else if (key === 'Delete') { game.answer = []; paintAnswer(); }
  else if (key === 'Enter' && !event.target.closest('button')) submitAnswer();
  else return;
  event.preventDefault();
});
</script>
